name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已有 tag（如 v2.0.0）：只补发容器镜像，不重跑二进制打包"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: GoReleaser 多平台打包
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: 校验 tag 在 main 上
        run: git log -1 --pretty=%s

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: 多架构容器镜像
    runs-on: ubuntu-latest
    needs: binaries
    # 手动触发时跳过 binaries（保留已有 Release 资产），只补发镜像。
    if: ${{ !cancelled() && (needs.binaries.result == 'success' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 解析版本号
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-dev}" >> "$GITHUB_OUTPUT"
      # 单镜像：插件由内嵌解释器执行，无需 Go 工具链
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/mr-losfer/s3bridge:latest
            ghcr.io/mr-losfer/s3bridge:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/Mr-losfer/s3bridge
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
