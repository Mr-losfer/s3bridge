name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要重新发布的 tag（如 v1.0.0）"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: GoReleaser 多平台打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.mod

      - name: 校验 tag 在 main 上
        run: git log -1 --pretty=%s

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: 多架构容器镜像
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 解析版本号
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION:-dev}" >> "$GITHUB_OUTPUT"
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/mr-losfer/s3bridge:latest
            ghcr.io/mr-losfer/s3bridge:${{ github.ref_name }}
            ghcr.io/mr-losfer/s3bridge:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/Mr-losfer/s3bridge
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
