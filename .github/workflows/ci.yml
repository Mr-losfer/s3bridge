name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go 质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.mod

      - name: gofmt 检查
        run: test -z "$(gofmt -s -l .)" || (echo "::error::需要 gofmt" && gofmt -s -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: 单元测试（竞态检测）
        run: go test -race ./...

      - name: 覆盖率
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: 全量构建
        run: |
          go build -o bin/s3bridge ./cmd/s3bridge
          go build -o bin/s3bridge-mcp ./cmd/s3bridge-mcp

      - name: 冒烟启动
        run: |
          S3BRIDGE_DATA_DIR=$(mktemp -d) S3BRIDGE_BOOTSTRAP_PASSWORD=ci-test-password \
            S3BRIDGE_HEALTH_INTERVAL=10s ./bin/s3bridge >/tmp/s3bridge.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/api/site
          curl -fsS -X POST http://127.0.0.1:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-test-password"}' | head -c 200
          kill "$pid" || true
          cat /tmp/s3bridge.log

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖并构建
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
      - name: 校验产物
        run: test -s internal/web/dist/index.html && test -d internal/web/dist/assets

  docs:
    name: 文档同步检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs/ 与 embed 副本必须一致
        run: |
          for f in plugin-development s3-api mcp installation; do
            diff -u "docs/$f.md" "internal/docs/files/$f.md" || {
              echo "::error::文档不同步，请执行 make docs-sync"
              exit 1
            }
          done
          echo "文档同步 OK"

  security:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
