version: 2

project_name: s3bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: s3bridge
    main: ./cmd/s3bridge
    binary: s3bridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: s3bridge-mcp
    main: ./cmd/s3bridge-mcp
    binary: s3bridge-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [s3bridge, s3bridge-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "s3bridge_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - deployments/docker-compose.yml
      - deployments/entrypoint.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: 新功能
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 修复
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 其他
      order: 999

release:
  github:
    owner: Mr-losfer
    name: s3bridge
  draft: false
  prerelease: auto
  name_template: "S3Bridge {{ .Version }}"
  header: |
    ### 版本亮点
    * **重要：后台 UI 全面重构为 shadcn/ui 风格**，桌面与移动端自适应、亮暗双主题，全部业务能力与接口保持不变
    * feat: 引入 Tailwind CSS 4 与 shadcn-vue 原语，建立语义 token 体系，13 个页面统一重写
    * feat: 桌面固定侧栏 + 移动端顶栏抽屉导航，表格页在窄屏自动降级为卡片列表
    * fix: 修复移动端 MCP 页长命令块导致的横向溢出、暗色模式下卡片层次不清
  footer: |
    ---
    **安装**：见 [安装与部署文档](https://github.com/Mr-losfer/s3bridge/blob/main/docs/installation.md)
    **校验**：`sha256sum -c checksums.txt`
