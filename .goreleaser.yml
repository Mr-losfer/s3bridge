version: 2

project_name: s3bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: s3bridge
    main: ./cmd/s3bridge
    binary: s3bridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: s3bridge-mcp
    main: ./cmd/s3bridge-mcp
    binary: s3bridge-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [s3bridge, s3bridge-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "s3bridge_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - deployments/docker-compose.yml
      - deployments/entrypoint.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: 新功能
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 修复
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 其他
      order: 999

release:
  github:
    owner: Mr-losfer
    name: s3bridge
  draft: false
  prerelease: auto
  name_template: "S3Bridge {{ .Version }}"
  header: |
    ### 插件不再需要 Go 工具链：改成在线编写、保存即生效

    v2.0 把插件做成了真正的 Go 程序，但每次改代码都要在服务端跑一次 `go build`（约 7 秒），
    还得给主机或镜像装 Go。**v2.1 换成内嵌 Go 解释器直接执行源码**，编译这一环彻底消失：

    * **保存即生效**。后台点「保存并生效」、Agent 调 `plugin_file_write`，服务端把源码合并、解析、热切换到新的 runner 进程。实测**单次加载 11–13 ms**（含入口改写、进程启动与 ping 握手），改完立刻上传就跑到新代码
    * **主功能延迟不变**。上传链路仍是「主服务 → 子进程调用 → 上游」，实测本地 mock 上游**端到端 2–3 ms**，与 v2.0 的编译产物模式一致
    * **仍然只部署一个二进制**。runner 是主程序自身的隐藏子命令（`__plugin_runner__`），既不落盘 SDK，也不再生成 `.build/plugin`
    * **镜像只剩一个变体**。删掉了 `-go` 版镜像与 CI 里的 Go 工具链，安装文档相应精简。
      顺带修掉一个一直存在的浪费：Dockerfile 原来用 `RUN chown -R /app` 改属主，overlayfs 会把 19 MB 的二进制整份复制进新层，
      改成 `COPY --chown` 后未压缩镜像从 98 MB 降到 **55 MB**（压缩后 22.9 MB，与 v2.0.1 的 22.4 MB 基本持平）

    ### 能力边界与兼容性

    * **只能用标准库**。解释器提供全部 Go 标准库（任意请求方法、multipart、AES/HMAC、JWT、压缩、编码都够用），
      但**第三方模块不再支持**——导入时会在加载阶段被直接拒绝，并提示改用标准库实现
    * **旧入口自动改写**。v2.0 的 `sdk.Serve(plugin{})` 单参写法会在加载时被自动改成
      `sdk.Serve(plugin{}.Upload, plugin{}.Check)` 并写回源文件，**不需要手工迁移**。
      之所以改成传函数，是因为解释器与宿主分属两套类型系统，函数值能无损跨边界、接口值不能
    * **错误定位精确到列**。多文件插件会先合并再执行，报错行号自动映射回原文件，
      形如 `main.go:34:21: unknown field URLL in struct literal`，Agent 可以直接照着改

    ### 使用体验

    * 后台「插件源码」页的按钮改为**保存并生效 / 重新加载**，结果区显示**加载结果**（PASS/FAIL）与耗时；
      插件详情顶部的状态同步为「已加载 / 未加载」
    * MCP 全部插件工具的描述统一为「加载」语义：`plugin_build` = 手动重新加载（返回加载日志、耗时、源码 SHA-256），
      `plugin_validate` = 在临时目录试加载（不落库），`plugin_manifest_update` 仍不触发重新加载
    * 《插件开发文档》按 v2.1 重写：入口约定、多文件合并规则、能力边界表、加载流程各阶段耗时、FAQ 全部更新

    > **从 v2.0.x 升级**：覆盖二进制并重启即可，现有插件首次调用（或首次保存）时自动改写入口。
    > **唯一的破坏性变更**是第三方库依赖——若你的插件 `import` 了非标准库的包，需要用标准库重写；
    > 只用到标准库的插件（含内置 WorkBuddy、`http-multipart` 模板）可直接运行。
    > 数据目录里遗留的 `cache/`、`plugins/*/.build/` 可以删掉，v2.1 不再使用。
  footer: |
    ---
    **安装**：见 [安装与部署文档](https://github.com/Mr-losfer/s3bridge/blob/main/docs/installation.md)
    **校验**：`sha256sum -c checksums.txt`
