version: 2

project_name: s3bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: s3bridge
    main: ./cmd/s3bridge
    binary: s3bridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: s3bridge-mcp
    main: ./cmd/s3bridge-mcp
    binary: s3bridge-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [s3bridge, s3bridge-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "s3bridge_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - deployments/docker-compose.yml
      - deployments/entrypoint.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: 新功能
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 修复
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 其他
      order: 999

release:
  github:
    owner: Mr-losfer
    name: s3bridge
  draft: false
  prerelease: auto
  name_template: "S3Bridge {{ .Version }}"
  header: |
    ### 版本亮点
    * **插件模型全新重构：插件就是 Go 程序**。每个插件是一个文件夹（`plugin.json` + 任意多个 `.go`），服务端运行时 `go build` 编译为独立可执行文件、以子进程调用。可发起任意次请求、使用任意方法（PUT / DELETE / multipart）、自由做加解密与签名——不再受「单请求模板」限制
    * **运行时编译 + 子进程隔离**：SDK 源码内嵌并落盘，插件 `go.mod` 通过 `replace` 指向本地，**离线可编译**；编译串行化、`CGO_ENABLED=0`、超时强杀、崩溃隔离、10 分钟空闲回收、编译成功即热切换
    * **新增图片有效期巡检**：本站归档图片默认 **72 小时（3 天）** 自检一次，只发 `HEAD`（不支持时退回 `Range: bytes=0-0`）判断「是否返回图片」，**绝不下载正文**；连续失败达阈值才标记失效并告警，相册与列表可直接筛选「已失效」
    * **后台新增多文件源码编辑器**：文件树（入口标记 / 系统文件只读）、保存即编译、编译器输出面板、产物 SHA-256、新建/改名/删除文件、一键导出全部源码
    * **MCP 插件开发工具重写**：`plugin_create` / `plugin_files` / `plugin_file_read` / `plugin_file_write` / `plugin_file_delete` / `plugin_file_rename` / `plugin_build` / `plugin_validate` / `plugin_manifest_update` / `plugin_export`，Agent 可全程完成「建插件 → 写代码 → 看编译错误 → 修复 → 调试看请求追踪 → 真实上传」闭环
    * **请求追踪**：插件每次出站请求的方法、URL、状态码、耗时、字节数与响应片段都会进入调试报告，`Authorization` / `Cookie` / `token` 等敏感字段自动脱敏
    * **平滑迁移**：v1.x 的内置 WorkBuddy 自动转为同名 Go 插件文件夹（源码可读可改），自定义声明式插件生成带说明的骨架并保留 `legacy-definition.json`
    * feat: MCP 工具数增至 53，新增 `plugin_files` / `plugin_file_read` / `plugin_file_write` / `plugin_file_delete` / `plugin_file_rename` / `plugin_build` / `plugin_manifest_update`
    * docs: 重写《插件开发文档》，新增《图片有效性》说明，MCP 工具清单与工作流同步更新
    * perf: 插件编译复用统一 `GOCACHE`，二次编译百毫秒级；上传路径不额外拷贝文件（插件直接读临时文件）
  footer: |
    ---
    **安装**：见 [安装与部署文档](https://github.com/Mr-losfer/s3bridge/blob/main/docs/installation.md)
    **校验**：`sha256sum -c checksums.txt`
