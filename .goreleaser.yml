version: 2

project_name: s3bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: s3bridge
    main: ./cmd/s3bridge
    binary: s3bridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: s3bridge-mcp
    main: ./cmd/s3bridge-mcp
    binary: s3bridge-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [s3bridge, s3bridge-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "s3bridge_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - deployments/docker-compose.yml
      - deployments/entrypoint.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: 新功能
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 修复
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 其他
      order: 999

release:
  github:
    owner: Mr-losfer
    name: s3bridge
  draft: false
  prerelease: auto
  name_template: "S3Bridge {{ .Version }}"
  header: |
    ### 本次修复（v2.0.0 之后的回归问题）
    * **修复：没配置的临时凭据被判成过期**。`http-multipart` 模板自带可选的 `token` 字段，留空时健康检测会报「未设置过期时间」，插件调试直接显示不健康。现在留空即视为「未启用」，不再告警
    * **修复：迁移后的声明式插件会被调度到、然后必然失败**。v1.x 自定义插件迁移出的 Go 骨架里 `Upload` 只能返回「尚未实现」，现在迁移即停用并写明原因，重写并编译通过后手动启用
    * **修复：迁移丢失参数与文件类型**。旧插件的 `fileTypes` 与参数键现在写进 `plugin.json`，参数按名称推断类型（含 key/token/secret 的标为敏感），旧 `enc:` 密文继续可解密
    * **修复：停用插件后参数表单变成一片空白**。停用状态不再清空参数回显，避免顺手保存把原配置抹掉
    * docs: 《插件开发文档》补充迁移规则表与「参数留空不告警」说明
    * test: 新增 `params` 单元测试（校验 / 临时凭据 / 加解密 / 脱敏 / 时间解析）与迁移、停用回显用例

    > 从 v2.0.0 升级无需任何操作，覆盖二进制并重启即可。
    > 从 v1.x 升级请先读《插件开发文档》第 9 章「v1.x 的声明式插件去哪了」。
  footer: |
    ---
    **安装**：见 [安装与部署文档](https://github.com/Mr-losfer/s3bridge/blob/main/docs/installation.md)
    **校验**：`sha256sum -c checksums.txt`
