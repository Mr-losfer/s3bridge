version: 2

project_name: s3bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: s3bridge
    main: ./cmd/s3bridge
    binary: s3bridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: s3bridge-mcp
    main: ./cmd/s3bridge-mcp
    binary: s3bridge-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [s3bridge, s3bridge-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "s3bridge_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - deployments/docker-compose.yml
      - deployments/entrypoint.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: 新功能
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 修复
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 其他
      order: 999

release:
  github:
    owner: Mr-losfer
    name: s3bridge
  draft: false
  prerelease: auto
  name_template: "S3Bridge {{ .Version }}"
  header: |
    ### 访问方式可选、失效图可配、开放上传默认走插件

    这一版围绕一件事：**别让这台服务器替 CDN 扛带宽**。默认路径全部改成 302，
    只有你自己选择「本站中转」时才由本机转发字节。

    #### 新增：文件访问方式（系统设置 → 文件访问）

    `GET /f/{bucket}/{key}` 对**有上游地址**的对象提供两种出口：

    | 方式 | 行为 | 带宽 |
    | --- | --- | --- |
    | `redirect`（默认） | `302 Location: 上游地址`，浏览器直连 CDN | 本机只回几百字节 |
    | `proxy` | 服务端拉取上游再转发，透传 Range，可拖进度条 | 走本机带宽 |

    * 上游连不上或返回 5xx 时，中转模式自动回退到本地归档副本，不会给页面一个坏图
    * 本地归档（没有上游地址）的对象仍然由本机输出——这台机器就是它的存储
    * 中转出站刻意不带 Referer，与页面级 no-referrer 一致，绕开防盗链

    #### 新增：失效图片

    图片有效性巡检判定失效后：

    * 直链只回占位图，不再回源，响应头带 `X-Object-Invalid: 1`
    * 配置了「失效图」地址 → `302` 到该图；没配 → 内置 SVG 占位（「文件已失效」）
    * 失效图指向对象自己时自动退回内置占位，不会 302 死循环
    * 上传列表、相册、缩略图、下载口四处统一走占位图，前端不再出现破图；
      列表卡片左上角标红「已失效」，相册筛选仍可按有效性过滤

    #### 改动：开放上传不再直接写本地

    之前开放上传固定 `PutLocal`，等于绕过了整条插件链路。现在默认按
    **「随机落桶 + 随机一个健康插件 + 失败回退本地」**执行：

    1. 请求没带 `bucket` → 在现有存储桶里随机挑一个（可在设置关掉，改用固定桶）
    2. 按**嗅探出的真实类型**随机挑一个健康插件上传（健康 = 已启用、能承接该类型、
       未被标记异常、且曾经成功过；刚装好没配参数的插件不参与）
    3. 没有可用插件或插件上传失败 → 按「回退本地」决定：开启则本地归档，关闭则报错

    三项都有开关，MCP 对应 `openUploadRandomBucket` / `openUploadUsePlugins` /
    `openUploadFallbackLocal`。

    #### 响应里补上「真实地址」

    `POST /api/open/upload` 与 `GET /api/link/sign` 新增：

    * `upstreamUrl`：**上游返回的真实地址**，想完全绕开本站就把流量直接打到这里
    * `upstreamExpiresAt`：上游地址过期时间（为空表示长期有效）
    * `storage`（`plugin` / `local`）、`provider`、`pluginId`、`accessMode`

    `url` 仍是本站直链，按当前访问方式 302 或中转，调用方不需要关心后端换了哪个 CDN。

    #### 其它

    * 新增内置失效占位 SVG（约 0.6 KB，零外部依赖）
    * 旧状态文件自动补 `accessMode=redirect` 与三个开放上传开关，用户改过的值不会被覆盖
    * 文档《接入方式》补「上传落点策略 / 文件访问方式 / 失效图片」三节

  footer: |
    ---
    **安装**：见 [安装与部署文档](https://github.com/Mr-losfer/s3bridge/blob/main/docs/installation.md)
    **校验**：`sha256sum -c checksums.txt`
