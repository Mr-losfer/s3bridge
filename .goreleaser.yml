version: 2

project_name: s3bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: s3bridge
    main: ./cmd/s3bridge
    binary: s3bridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: s3bridge-mcp
    main: ./cmd/s3bridge-mcp
    binary: s3bridge-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [s3bridge, s3bridge-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "s3bridge_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - deployments/docker-compose.yml
      - deployments/entrypoint.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: 新功能
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 修复
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 其他
      order: 999

release:
  github:
    owner: Mr-losfer
    name: s3bridge
  draft: false
  prerelease: auto
  name_template: "S3Bridge {{ .Version }}"
  header: |
    ### 版本亮点
    * **新增监控中心**：全站请求指标（1 小时 → 30 天三档时间线）、错误率、P50/P95/P99、慢接口与易错接口排行、运行时健康（goroutine / 内存 / 磁盘），以及结构化**异常日志**（7 类分类、按路由模板聚合、支持级别与关键字检索）
    * **新增存储体检**：桶健康分、类型分布、Top 大文件、重复内容、断链、孤儿文件、超期与即将过期、磁盘占用；快照毫秒级返回，深度体检异步执行并可轮询进度
    * **新增全站图片相册**：跨桶图墙，网格 / 瀑布流一键切换、时间与桶筛选、无限滚动、灯箱；游标分页让深翻页恒定耗时，缩略图按需生成并磁盘缓存
    * **性能优先**：埋点 **148 ns/op、0 次内存分配**，16 并发压测下监控接口 P95 < 40 ms，采集不拖慢业务
    * feat: MCP 新增 4 个只读工具（`monitor_summary` / `monitor_storage` / `monitor_errors` / `gallery_list`），工具总数增至 49
    * docs: 新增《监控中心与存储体检》《全站图片相册》两份文档，随二进制 embed，后台 / MCP / 仓库三处同源
  footer: |
    ---
    **安装**：见 [安装与部署文档](https://github.com/Mr-losfer/s3bridge/blob/main/docs/installation.md)
    **校验**：`sha256sum -c checksums.txt`
