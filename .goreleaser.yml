version: 2

project_name: s3bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: s3bridge
    main: ./cmd/s3bridge
    binary: s3bridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: s3bridge-mcp
    main: ./cmd/s3bridge-mcp
    binary: s3bridge-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [s3bridge, s3bridge-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "s3bridge_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - deployments/docker-compose.yml
      - deployments/entrypoint.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: 新功能
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 修复
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 其他
      order: 999

release:
  github:
    owner: Mr-losfer
    name: s3bridge
  draft: false
  prerelease: auto
  name_template: "S3Bridge {{ .Version }}"
  header: |
    ### v2.2.1：升级迁移修复

    一个小时的补丁版本，只修 v2.2.0 升级路径上的两个问题，功能与接口没有变化。

    #### 修复：从 v2.1.x 升级后「接入方式」设置丢失

    v2.2.0 新增了 WebDAV / FTP / 开放上传三组设置字段，但老版本写下的 `state.json` 里没有这些键。
    直接读出来就是零值，结果是升级后 **WebDAV 静默变关闭、FTP 监听地址为空、开放上传没有默认桶**——
    后台「接入方式」卡片看着正常，实际连不上。

    * `store.Open` 末尾补迁移：用 `OpenUploadBucket` 是否为空判断是否为旧状态文件，一次性补齐默认值
    * WebDAV 恢复为默认开启、FTP 监听地址回填 `:2121`、开放上传默认桶回填 `default`
    * 迁移只跑一次：之后用户在界面上主动关掉 WebDAV 不会被重新打开（已有状态文件不再命中标记）
    * 补 `TestOpenMigratesIntegrationSettings` 覆盖「旧文件补默认值」与「新文件不被改动」两条路径

    #### 修复：WebDAV 请求不存在的桶

    `PROPFIND /dav/没这个桶/` 此前会走到对象查询分支并返回一个空目录，客户端会显示为「空文件夹」而不是报错，
    容易误以为数据丢了。

    * 先做桶存在性校验，不存在直接 `404`；`MKCOL` 新建桶、上传到不存在的桶仍然返回 404，不会凭空建桶

    #### 其它

    * 清理仓库里两个没有被 `index.html` 引用的历史前端产物（约 1.1 MB）
    * 无 API 变更、无配置变更，v2.2.0 的开放上传 / WebDAV / FTP 用法完全不变

    > 从 v2.1.x 或 v2.2.0 升级：覆盖二进制并重启即可。首次启动会自动补齐接入方式设置。

  footer: |
    ---
    **安装**：见 [安装与部署文档](https://github.com/Mr-losfer/s3bridge/blob/main/docs/installation.md)
    **校验**：`sha256sum -c checksums.txt`
