version: 2

project_name: s3bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: s3bridge
    main: ./cmd/s3bridge
    binary: s3bridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: s3bridge-mcp
    main: ./cmd/s3bridge-mcp
    binary: s3bridge-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [s3bridge, s3bridge-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "s3bridge_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - deployments/docker-compose.yml
      - deployments/entrypoint.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: 新功能
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 修复
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 其他
      order: 999

release:
  github:
    owner: Mr-losfer
    name: s3bridge
  draft: false
  prerelease: auto
  name_template: "S3Bridge {{ .Version }}"
  header: |
    ### 本次修复（v2.1.0 之后）

    * **修复：加载成功后状态一直显示「尚未加载」**。新建插件写入源码、加载已经成功，界面顶部却还停在「新建插件，尚未加载」，
      看起来像没生效。原因是加载成功只有在状态为「异常」时才改写消息。现在只要不是停用或已健康，一律回落到
      「已加载，等待健康检测」；同时补了一个覆盖「创建 → 写坏 → 修好」全过程的用例，避免再回归
    * **修复：源码页的加载日志标签写着 `GO BUILD`**。v2.1.0 已经不再编译，标签却沿用了 v2.0 的写法，
      与「内嵌解释器」自相矛盾。改为 `ENGINE`，与后端日志前缀 `[engine]` 一致
    * **清理**：`PluginSource` 组件里恒为真的 `toolchain` 开关（以及它导致的按钮禁用条件）已移除，
      后端字段保留为兼容值

    > 插件引擎「不再需要 Go 工具链、在线编写保存即生效」的完整说明与实测数据，见
    > [v2.1.0 发布说明](https://github.com/Mr-losfer/s3bridge/releases/tag/v2.1.0)。
    > 从 v2.1.0 升级无需任何操作，覆盖二进制并重启即可。
  footer: |
    ---
    **安装**：见 [安装与部署文档](https://github.com/Mr-losfer/s3bridge/blob/main/docs/installation.md)
    **校验**：`sha256sum -c checksums.txt`
